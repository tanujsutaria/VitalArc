name: Branch Naming Convention

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

jobs:
  validate-branch-name:
    name: Validate Branch Name
    runs-on: ubuntu-latest

    steps:
      - name: Check branch naming convention
        uses: actions/github-script@v8
        with:
          script: |
            const branchName = context.payload.pull_request.head.ref;

            // Allow main branch
            if (branchName === 'main') {
              console.log('Branch is main - OK');
              return;
            }

            // Pattern 1: Workstation branches
            // dev/<platform>-<focus>-<session>.<minor>-YYYY-MM-DD
            const devPattern = /^dev\/(mac|cloud)-[a-z]+-\d+\.\d+-\d{4}-\d{2}-\d{2}$/;

            // Pattern 2: Claude Code cloud session branches (platform-controlled)
            // claude/<skill>-<sessionID>
            const claudePattern = /^claude\/[a-z-]+-[a-zA-Z0-9]+$/;

            if (devPattern.test(branchName)) {
              console.log(`Branch name "${branchName}" follows dev/ naming convention.`);
              return;
            }

            if (claudePattern.test(branchName)) {
              console.log(`Branch name "${branchName}" is a Claude Code cloud session branch - OK.`);
              return;
            }

            // Provide helpful error message
            const errorMessage = `
            ## Branch Naming Error

            Branch name \`${branchName}\` does not follow the required naming convention.

            ### Allowed Formats

            **1. Workstation branches** (manual creation):
            \`dev/<platform>-<focus>-<session>.<minor>-YYYY-MM-DD\`

            | Component | Description | Required |
            |-----------|-------------|----------|
            | \`dev/\` | Branch prefix | Yes |
            | \`<platform>\` | \`mac\` or \`cloud\` | Yes |
            | \`<focus>\` | Feature area (e.g., \`nutrition\`, \`workout\`, \`session\`) | Yes |
            | \`<session>\` | Session number from SESSION_LOG.md | Yes |
            | \`<minor>\` | Sub-version for same day (0, 1, 2...) | Yes |
            | \`<date>\` | ISO date (YYYY-MM-DD) | Yes |

            **2. Claude Code cloud branches** (platform-controlled):
            \`claude/<skill>-<sessionID>\`

            ### Valid Examples
            - \`dev/mac-nutrition-12.0-2026-01-27\`
            - \`dev/cloud-workout-12.0-2026-01-27\`
            - \`claude/vitalarc-start-cloud-abc123\`

            ### Invalid Examples
            - \`dev/nutrition-12.0-2026-01-27\` - Missing platform
            - \`feature/nutrition\` - Wrong prefix, missing required parts
            `;

            core.setFailed(errorMessage);
