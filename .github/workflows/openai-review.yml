name: OpenAI Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]
    paths:
      - '**/*.swift'

permissions:
  contents: read
  pull-requests: write

jobs:
  openai-review:
    name: AI Code Review
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v47
        with:
          files: |
            **/*.swift

      - name: Review with GPT-5.2-Codex
        if: steps.changed-files.outputs.any_changed == 'true'
        uses: actions/github-script@v8
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        with:
          script: |
            const changedFiles = '${{ steps.changed-files.outputs.all_changed_files }}'.split(' ').filter(f => f);

            if (changedFiles.length === 0) {
              console.log('No Swift files changed');
              return;
            }

            // Skip if no API key configured
            if (!process.env.OPENAI_API_KEY) {
              console.log('OPENAI_API_KEY not configured - skipping AI review');
              return;
            }

            const fs = require('fs');
            const https = require('https');

            // Collect file contents (limit to prevent token overflow)
            let codeContext = '';
            const maxFiles = 10;
            const maxCharsPerFile = 5000;

            for (const file of changedFiles.slice(0, maxFiles)) {
              try {
                const content = fs.readFileSync(file, 'utf8');
                const truncated = content.substring(0, maxCharsPerFile);
                codeContext += `\n--- ${file} ---\n${truncated}\n`;
                if (content.length > maxCharsPerFile) {
                  codeContext += `\n[... truncated, ${content.length - maxCharsPerFile} more chars ...]\n`;
                }
              } catch (e) {
                console.log(`Could not read ${file}: ${e.message}`);
              }
            }

            if (changedFiles.length > maxFiles) {
              codeContext += `\n[... and ${changedFiles.length - maxFiles} more files ...]\n`;
            }

            // Get PR diff for context
            const { data: diff } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              mediaType: { format: 'diff' }
            });

            const truncatedDiff = diff.substring(0, 10000);

            const systemPrompt = `You are an expert iOS code reviewer specializing in SwiftUI and SwiftData applications.
            Perform deep analysis of the code changes with thorough reasoning about potential issues, architectural implications, and best practices.
            Be meticulous and consider edge cases, thread safety, memory management, and Swift-specific patterns.`;

            const userPrompt = `You are reviewing a Pull Request for VitalArc, an iOS fitness app built with SwiftUI and SwiftData.

            PR Title: ${context.payload.pull_request.title}
            PR Description: ${context.payload.pull_request.body || 'No description provided'}

            Changed files:
            ${changedFiles.join('\n')}

            Diff (truncated):
            \`\`\`diff
            ${truncatedDiff}
            \`\`\`

            File contents:
            ${codeContext}

            Please review this code and provide:
            1. A brief summary of the changes (2-3 sentences)
            2. Any potential bugs or issues (be specific with file:line if possible)
            3. Code quality suggestions (following Swift/SwiftUI best practices)
            4. Security considerations if applicable

            Keep your review concise and actionable. Focus on significant issues, not style nitpicks.
            Format your response as markdown suitable for a GitHub PR comment.`;

            // Call OpenAI Codex API (uses completions endpoint, not chat)
            const fullPrompt = `${systemPrompt}\n\n${userPrompt}\n\nReview:`;

            const requestData = JSON.stringify({
              model: 'gpt-5.2-codex',
              prompt: fullPrompt,
              max_tokens: 4096,
              temperature: 0.2,
              stop: ['---END---']
            });

            const options = {
              hostname: 'api.openai.com',
              port: 443,
              path: '/v1/completions',
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${process.env.OPENAI_API_KEY}`
              }
            };

            const response = await new Promise((resolve, reject) => {
              const req = https.request(options, (res) => {
                let data = '';
                res.on('data', chunk => data += chunk);
                res.on('end', () => {
                  if (res.statusCode === 200) {
                    resolve(JSON.parse(data));
                  } else {
                    reject(new Error(`API error: ${res.statusCode} - ${data}`));
                  }
                });
              });
              req.on('error', reject);
              req.write(requestData);
              req.end();
            });

            const reviewContent = response.choices[0].text;

            // Post review as comment
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: `## GPT-5.2-Codex Code Review\n\n${reviewContent}\n\n---\n*Automated review by GPT-5.2-Codex with extra high reasoning. This is advisory - always verify suggestions.*`
            });

            console.log('Review posted successfully');
