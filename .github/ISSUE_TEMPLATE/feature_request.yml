name: Feature Request
description: Suggest a new feature or enhancement
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature! Help us understand your idea.

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem does this feature solve? What's the use case?
      placeholder: I'm frustrated when...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution you'd like
      placeholder: I would like...
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Feature Area
      description: Which part of the app does this relate to?
      options:
        - Health Dashboard
        - Workout Tracking
        - Exercise Library
        - Templates
        - Mesocycles
        - Nutrition
        - Analytics
        - Profile/Settings
        - Onboarding
        - Apple Watch
        - Widgets
        - Notifications
        - New Feature
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority (your opinion)
      options:
        - Nice to have
        - Would improve my experience
        - Important for my use case
        - Critical / blocking
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or workarounds you've considered?

  - type: textarea
    id: mockups
    attributes:
      label: Mockups / References
      description: Any mockups, screenshots, or references from other apps?
      placeholder: Drag and drop images or paste links

  - type: checkboxes
    id: terms
    attributes:
      label: Checklist
      options:
        - label: I have searched for existing feature requests
          required: true
